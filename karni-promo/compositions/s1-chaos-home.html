        stars.push({ el: el, ph: rnd() * Math.PI * 2, f: 1.4 + rnd() * 1.6, peak: 0.55 + rnd() * 0.4 });
      });
      var amb = { k: 0 };
      tl.fromTo(amb, { k: 0 }, {
        k: 1, duration: 2.05, ease: "none", immediateRender: false,
        onUpdate: function () {
          var t = tl.time();
          var env = Math.max(0, Math.min(1, (t - 1.95) / 0.4));
          stars.forEach(function (s) {
            var w = 0.5 + 0.5 * Math.sin(t * s.f * Math.PI * 2 + s.ph);
            s.el.style.opacity = String(env * s.peak * (0.25 + 0.75 * w));
            s.el.style.transform = "translateY(" + (-(t - 1.95) * 14) + "px) scale(" + (0.6 + 0.5 * w) + ") rotate(" + (w * 30) + "deg)";
          });
        },
      }, 1.95);
      window.__timelines = window.__timelines || {};
      window.__timelines["s1-chaos-home"] = tl;
    })();
  </script>
</template>
