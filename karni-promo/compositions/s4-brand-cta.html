  <script>
    (function () {
      var P = "s4-brand-cta", DUR = 7;
      var $ = function (n) { return document.getElementById(P + "-" + n); };
      var tl = gsap.timeline({ paused: true });
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      var rnd = mulberry32(18250925);
      function dash(p, pad) { var len = p.getTotalLength() * pad; p.style.strokeDasharray = String(len); p.style.strokeDashoffset = String(len); return len; }

      // ===== Scene 1 (0.00–0.75): purple-white color transition =====
      // circle() % is relative to sqrt(w^2 + h^2) / sqrt(2) = 1557.7 px on 1080x1920 -> 15.577 px per %.
      var field = $("field"), rims = [$("rim-soft"), $("rim-core")], circ = { p: 0 };
      function applyCircle() {
        var r = circ.p * 15.577, a = r < 24 ? r / 24 : (r > 980 ? Math.max(0, 1 - (r - 980) / 260) : 1);
        field.style.clipPath = "circle(" + r.toFixed(1) + "px at 540px 960px)";

      applyCircle();
      tl.to(circ, { p: 150, duration: 0.75, ease: "expo.inOut", onUpdate: applyCircle }, 0);
      // lilac-to-white band sweeps diagonally (right -> left) just ahead of the circle

      // the purple field settles inward as it opens; two radial glows drift slowly (at rest on the final frame)

      tl.fromTo($("glow-a"), { x: 0, y: 0, opacity: 0.5 }, { x: 230, y: 160, opacity: 1, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo($("glow-b"), { x: 0, y: 0, opacity: 0.5 }, { x: -240, y: -190, opacity: 1, duration: DUR, ease: "sine.inOut" }, 0);

      // ===== Scene 2 (0.80–2.50): neon brand =====
      tl.fromTo([$("unlit1"), $("unlit2")], { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.45);
      // ignition: deterministic stepped flicker 0 -> .85 -> .15 -> 1 -> .5 -> 1 over 0.45 s, on the timeline clock
      var FLICK = [[0, 0], [0.07, 0.85], [0.14, 0.15], [0.22, 1], [0.32, 0.5], [0.42, 1]];
      [[$("lit1"), 0.85], [$("lit2"), 1.25]].forEach(function (w) {
        FLICK.forEach(function (k) { tl.set(w[0], { opacity: k[1] }, w[1] + k[0]); });
      });
      // halo bloom behind the sign lands with the second word's ignition (~1.70)
      tl.fromTo($("halo"), { opacity: 0, scale: 0.84 }, { opacity: 0.3, scale: 1, duration: 0.75, ease: "power2.out" }, 0.95);
      // neon outline draws from top-centre outward around both lines (svg-path-draw), glowing heads lead the stroke
      var tubes = [$("tube-r"), $("tube-l")], heads = [$("head-r"), $("head-l")];
      var tubeLen = tubes.map(function (p) { return dash(p, 1); });
      tubes.forEach(function (p, i) {
        tl.fromTo(p, { strokeDashoffset: tubeLen[i] }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 1.4);
      });
      var draw = { p: 0 };
      function applyHeads() {
        heads.forEach(function (h, i) {
          var pt = tubes[i].getPointAtLength(draw.p * tubeLen[i]);
          h.setAttribute("cx", pt.x.toFixed(1)); h.setAttribute("cy", pt.y.toFixed(1));
        });
      }
      applyHeads();
      tl.to(draw, { p: 1, duration: 0.9, ease: "power2.out", onUpdate: applyHeads }, 1.4);
      tl.fromTo(heads, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 1.4);
      tl.to(heads, { opacity: 0, duration: 0.25, ease: "power1.in" }, 2.1);
      // glow breathes gently 2.5 -> end (bounded, ±15 %), amplitude settling to zero over the last ~0.6 s
      var lit = [$("lit1"), $("lit2")], halo = $("halo"), br = { p: 0 }, CYC = 2;
      function neonShadow(k) {
        return "0 0 2px rgba(255,255,255,0.95), 0 0 " + (10 * k).toFixed(2) + "px rgba(201,168,245," + Math.min(1, 0.9 * k).toFixed(3) +
          "), 0 0 " + (28 * k).toFixed(2) + "px rgba(109,0,204," + (0.45 * k).toFixed(3) + "), 0 0 " + (60 * k).toFixed(2) + "px rgba(109,0,204," + (0.45 * k).toFixed(3) + ")";
      }
      tl.to(br, {
        p: Math.PI * 2 * CYC, duration: DUR - 2.5, ease: "none",
        onUpdate: function () {
          var u = br.p / (Math.PI * 2 * CYC), env = u < 0.86 ? 1 : Math.max(0, (1 - u) / 0.14);
          var k = 1 + 0.15 * Math.sin(br.p) * env, sh = neonShadow(k);
          lit.forEach(function (el) { el.style.textShadow = sh; });
          tubes.forEach(function (el) { el.style.strokeOpacity = String(Math.min(0.95, 0.8 * k)); });
          halo.style.opacity = String(0.3 * (1 + 0.15 * Math.sin(br.p + 0.6) * env));
        },
      }, 2.5);

      // ===== Scene 3 (2.60–3.70): tagline waterfall + rewinding clock =====
      var clock = $("clock"), clkParts = [$("clk-arc"), $("clk-arrow")];
      tl.set(clock, { opacity: 1 }, 2.6);
      tl.fromTo(clock, { scale: 0.6, y: 30 }, { scale: 1, y: 0, duration: 0.35, ease: "power4.out" }, 2.6);
      var clkLen = clkParts.map(function (p) { return dash(p, 1.05); });
      tl.fromTo(clkParts[0], { strokeDashoffset: clkLen[0] }, { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, 2.6);
      tl.fromTo(clkParts[1], { strokeDashoffset: clkLen[1] }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 2.6 + 0.42 * 0.75);
      // hands spin BACKWARD two turns and settle (svg-icon-enrichment: SVG transform attribute, explicit centre)
      var handM = $("hand-m"), handH = $("hand-h"), spin = { m: 720, h: 176.6 };
      function applyHands() {
        handM.setAttribute("transform", "rotate(" + spin.m.toFixed(2) + " 12 12)");
        handH.setAttribute("transform", "rotate(" + spin.h.toFixed(2) + " 12 12)");
      }
      applyHands();
      tl.to(spin, { m: 0, h: 116.6, duration: 1.05, ease: "back.out(1.3)", onUpdate: applyHands }, 2.68);
      // words whip in from below, binary opacity, overlapping arrivals (waterfall-entry)
      var F = 1 / 60, t = 2.64;
      [["tw1", 76, 0.18, 2 * F], ["tw2", 46, 0.15, -F], ["tw3", 36, 0.12, -F], ["tw4a", 72, 0.16, -F - 0.02], ["tw4b", 72, 0.15, 0]].forEach(function (w) {
        tl.set($(w[0]), { opacity: 1, y: w[1] }, t);

      // ===== Scene 4 (3.90–4.80): CTA springs up =====
      tl.fromTo($("cta-halo"), { opacity: 0, scale: 0.8 }, { opacity: 0.42, scale: 1, duration: 0.6, ease: "power2.out" }, 3.9);
      tl.fromTo($("cta"), { scale: 0, opacity: 0, y: 40 }, { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.8)" }, 3.9);
      ["dot1", "dot2", "dot3"].forEach(function (d, i) {
        tl.fromTo($(d), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.24, ease: "power3.out" }, 4.32 + i * 0.09);
      });
      // one-pass lilac sheen across the pill, right -> left (reading direction)
      tl.fromTo($("sheen"), { x: 420, rotation: 18, opacity: 0 }, { x: -420, rotation: 18, opacity: 1, duration: 0.6, ease: "none" }, 4.62);
      tl.to($("sheen"), { opacity: 0, duration: 0.12, ease: "power1.in" }, 5.1);
