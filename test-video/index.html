<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d0618;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: sans-serif;
        color: #f6f1ff;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 120%, #2a0a52 0%, #0d0618 60%);
      }
      #glow {
        position: absolute;
        width: 900px;
        height: 900px;
        left: 510px;
        top: 90px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(109, 0, 204, 0.55) 0%, rgba(109, 0, 204, 0) 70%);
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        text-align: center;
        direction: rtl;
      }
      .line {
        display: flex;
        gap: 0.28em;
        justify-content: center;
      }
      .word {
        display: inline-block;
      }
      .title {
        font-size: 150px;
        font-weight: 700;
        line-height: 1.1;
      }
      .sub {
        font-size: 52px;
        font-weight: 400;
        color: #c9b3f5;
        letter-spacing: 0.02em;
      }
      .big {
        font-size: 170px;
        font-weight: 700;
        line-height: 1.1;
      }
      .accent-1 {
        color: #ff7ac6;
      }
      .accent-2 {
        color: #b98bff;
      }
      .accent-3 {
        color: #6ee7d8;
      }
      .rule {
        width: 640px;
        height: 8px;
        border-radius: 4px;
        background: linear-gradient(90deg, #6ee7d8, #b98bff, #ff7ac6);
      }
      .check {
        font-size: 64px;
        font-weight: 600;
        color: #6ee7d8;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>
      <div id="glow"></div>

      <section id="s1" class="scene clip" data-start="0" data-duration="3.4" data-track-index="1">
        <div id="s1-inner" class="scene">
          <div class="line title">
            <span class="word s1-w">דסק</span>
            <span class="word s1-w">מעקב</span>
            <span class="word s1-w">ותוכן</span>
          </div>
          <div id="s1-sub" class="sub">הדס קרני · שיווק דיגיטלי</div>
        </div>
      </section>

      <section id="s2" class="scene clip" data-start="3.4" data-duration="3.4" data-track-index="1">
        <div id="s2-inner" class="scene">
          <div class="line big">
            <span class="word s2-w accent-1">רילס.</span>
            <span class="word s2-w accent-2">סטוריז.</span>
            <span class="word s2-w accent-3">פוסטים.</span>
          </div>
        </div>
      </section>

      <section id="s3" class="scene clip" data-start="6.8" data-duration="3.2" data-track-index="1">
        <div id="s3-inner" class="scene">
          <div class="line title">
            <span class="word s3-w">סרטון</span>
            <span class="word s3-w">בדיקה</span>
          </div>
          <div id="s3-rule" class="rule"></div>
          <div id="s3-check" class="check">✓ HyperFrames עובד</div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Background glow drifts and breathes across the whole piece.
      tl.fromTo("#glow", { x: -220, scale: 0.85 }, { x: 220, scale: 1.15, duration: 10, ease: "sine.inOut" }, 0);

      // Scene 1: title words rise in, subtitle follows, then everything lifts away.
      tl.fromTo(".s1-w", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out", stagger: 0.18 }, 0.2);
      tl.fromTo("#s1-sub", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 1.0);
      tl.to("#s1-inner", { y: -60, opacity: 0, duration: 0.45, ease: "power2.in" }, 2.85);

      // Scene 2: each word pops in with a slight overshoot.
      tl.fromTo(".s2-w", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(2)", stagger: 0.35 }, 3.5);
      tl.to("#s2-inner", { scale: 1.08, opacity: 0, duration: 0.45, ease: "power2.in" }, 6.25);

      // Scene 3: words slide in, the rule draws, the check line lands and holds.
      tl.fromTo(".s3-w", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.15 }, 6.9);
      tl.fromTo("#s3-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 7.4);
      tl.fromTo("#s3-check", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 7.9);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
